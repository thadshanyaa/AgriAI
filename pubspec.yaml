name: agriai
description: AI Based Smart Farming Assistant
publish_to: "none"

version: 1.7.5+19

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Fonts
  google_fonts: ^6.3.0

  # Image Picker
  image_picker: ^1.2.0
  image: ^4.8.0

  # On-device AI inference
  tflite_flutter: ^0.12.1

  # HTTP API
  http: ^1.5.0
  xml: ^6.6.1
  url_launcher: ^6.3.2

  # Local Storage
  shared_preferences: ^2.5.3

  # GPS
  geolocator: ^14.0.2

  # Permission
  permission_handler: ^12.0.1

  # SVG Images
  flutter_svg: ^2.2.0

  # Date Format
  intl: ^0.20.2

  # Loading Animation
  flutter_spinkit: ^5.2.2

  # Lottie Animation
  lottie: ^3.3.2

  # Voice assistant
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

  # Fingerprint / face authentication
  local_auth: ^3.0.2

  # Camera
  camera: ^0.11.2

  # Bottom Navigation
  curved_navigation_bar: ^1.0.6

  # Icons
  font_awesome_flutter: ^10.10.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  pdf: ^3.12.0
  path_provider: ^2.1.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/agriai_app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/agriai_app_icon.png
  adaptive_icon_foreground_inset: 12
  min_sdk_android: 21

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/models/

  # Enable this section only after adding the font files.
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
